<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mustache Protocol: The Game</title>
  <meta name="description" content="Googlebook | Henry Cavill. Mustache Protocol: The Game." />
  <meta property="og:title" content="Mustache Protocol: The Game" />
  <meta property="og:description" content="Googlebook | Henry Cavill. Mustache Protocol: The Game." />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <script type="module" crossorigin src="./assets/main-BnlzpU15.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-BBxYxh4e.css">
</head>

<body>
  <div id="app">
    <!-- Fullscreen Game Canvas Viewport -->
    <div id="game-container" class="game-viewport"></div>

    <!-- Portrait Orientation Warning Overlay (Touch devices) -->
    <div id="rotate-overlay" class="rotate-overlay" aria-hidden="true">
      <div class="rotate-device-icon" aria-hidden="true">
        <svg class="phone-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="18" y="8" width="28" height="48" rx="5" stroke="#00f0ff" stroke-width="2.5" fill="rgba(0, 240, 255, 0.08)"/>
          <line x1="28" y1="12" x2="36" y2="12" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
          <circle cx="32" cy="50" r="2" fill="#00f0ff"/>
          <path d="M12 28 C10 18, 22 10, 32 10" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
          <path d="M30 6 L35 10 L30 14" fill="#ffd700"/>
        </svg>
      </div>
      <div class="rotate-text">Rotate to play</div>
    </div>

    <!-- Bottom Keybindings Bar -->
    <footer id="keybindings-bar" class="keybindings-bar" aria-label="Game Controls">
      <div class="key-group">
        <span class="key-badge">◀ ▶</span>
        <span class="key-badge">A D</span>
        <span class="key-label" id="key-label-move">MOVE</span>
      </div>
      <div class="key-separator"></div>
      <div class="key-group">
        <span class="key-badge">↑</span>
        <span class="key-badge">SPACE</span>
        <span class="key-label" id="key-label-jump">JUMP</span>
      </div>
      <div class="key-separator"></div>
      <div class="key-group">
        <span class="key-badge">J</span>
        <span class="key-label" id="key-label-attack">ATTACK</span>
      </div>
      <div class="key-separator"></div>
      <button id="btn-boss" class="key-group key-btn" type="button" tabindex="-1" title="Warp to Boss Arena (Press B)">
        <span class="key-badge" style="background: rgba(255, 215, 0, 0.25); border-color: rgba(255, 215, 0, 0.6); color: #ffd700;">B</span>
        <span class="key-label" style="color: #ffd700;">BOSS ARENA</span>
      </button>
      <div class="key-separator"></div>
      <button id="btn-crt" class="key-group key-btn" type="button" tabindex="-1" title="Toggle CRT Filter">
        <span class="key-label crt-status-text">CRT: OFF</span>
      </button>
    </footer>
  </div>

</body>

</html>
